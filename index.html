<script>

(function()

{
const canvas = document.getElementById('noiseCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const controlContainer = document.getElementById('controls');
const pauseBtn = document.getElementById('pauseBtn');
const btnYellow = document.getElementById('btnYellow');
const inputList = Array.from(controlContainer.querySelectorAll('input'));
const inputs = {};

const W_R = 0.2126, W_G = 0.7152, W_B = 0.0722;

inputList.forEach
((el) =>
{   const key = el.id.replace('Max', '').replace('Rate', '');
    inputs[key] = el;
    el.style.setProperty('--thumb-color', el.dataset.color); });

let width, height, imgData, buffer, isPaused = false, allowYellow = false, userInterrupted = false;
let speeds = { blur: 0, cluster: 0, pattern: 0, speckle: 0 };

function updateSettings()
{   const area = width * height;
    const maxPixels = (area / 10) | 0;

    speeds.blur = (Math.pow(inputs.blur.value / 100, 10) * maxPixels) | 0;
    speeds.cluster = (Math.pow(inputs.cluster.value / 100, 10) * maxPixels) | 0;
    speeds.pattern = (Math.pow(inputs.pattern.value / 100, 10) * maxPixels) | 0;
    speeds.speckle = (Math.pow(inputs.speckle.value / 100, 5) * (maxPixels / 2)) | 0;

    const maxR = parseInt(inputs.r.value), maxG = parseInt(inputs.g.value), maxB = parseInt(inputs.b.value);
    const uiColor = `rgb(${maxR}, ${maxG}, ${maxB})`;
    document.documentElement.style.setProperty('--ui-color', uiColor);
    document.documentElement.style.setProperty('--bg-opacity', inputs.opacity.value / 100);

    inputList.forEach
    ((el) =>
    {   const pct = (el.value - el.min) / (el.max - el.min) * 100;
        el.style.background = `linear-gradient(to right, ${el.dataset.color} ${pct}%, rgba(255,255,255,0.1) ${pct}%)`; });
}

function updateButtonUI()
{   if (allowYellow)
    {   btnYellow.classList.add('active');
        btnYellow.textContent = "Prevent Yellow In Speckles"; }
    else
    {   btnYellow.classList.remove('active');
        btnYellow.textContent = "Allow Yellow In Speckles"; }
}

function resize()
{   width = window.innerWidth;
    height = window.innerHeight + 150;
    canvas.width = width;
    canvas.height = height;
    imgData = ctx.createImageData(width, height);
    buffer = new Uint32Array(imgData.data.buffer);
    buffer.fill(0xFF000000);
    updateSettings(); }

function addSpeckle()
{   const minB = parseFloat(inputs.minBright.value);
    const maxB = parseFloat(inputs.maxBright.value);
    const rMult = (parseInt(inputs.r.value) + 1) / 256;
    const gMult = (parseInt(inputs.g.value) + 1) / 256;
    const bMult = (parseInt(inputs.b.value) + 1) / 256;

    const idx = ((Math.random() * height) | 0) * width + ((Math.random() * width) | 0);
    const baseBright = minB + Math.random() * (maxB - minB);

    let r = (baseBright * rMult) | 0;
    let g = (baseBright * gMult) | 0;
    let b = (baseBright * bMult) | 0;

    if (!allowYellow)
    {   if (Math.random() < 0.5) r = 0;
        else g = 0; }

    buffer[idx] = 0xFF000000 | (b << 16) | (g << 8) | r;
}

function processPixels(count, mode)
{   for (let i = 0; i < count; i++)
    {   const x = (Math.random() * width) | 0, y = (Math.random() * height) | 0, idx = y * width + x;
        const n =
            [buffer[((y > 0 ? y - 1 : y) * width) + x],
            buffer[((y < height - 1 ? y + 1 : y) * width) + x],
            buffer[(y * width) + (x > 0 ? x - 1 : x)],
            buffer[(y * width) + (x < width - 1 ? x + 1 : x)]];

        if (mode === 'blur')
        {   const r = ((n[0]&0xFF)+(n[1]&0xFF)+(n[2]&0xFF)+(n[3]&0xFF))>>2;
            const g = (((n[0]>>8)&0xFF)+((n[1]>>8)&0xFF)+((n[2]>>8)&0xFF)+((n[3]>>8)&0xFF))>>2;
            const b = (((n[0]>>16)&0xFF)+((n[1]>>16)&0xFF)+((n[2]>>16)&0xFF)+((n[3]>>16)&0xFF))>>2;
            buffer[idx] = 0xFF000000 | (b << 16) | (g << 8) | r; }
        else if (mode === 'cluster') buffer[idx] = n[(Math.random() * 4) | 0];
        else
        {   let minDist = Infinity, p = [n[0], n[1]];
            for (let j = 0; j < 3; j++)
            {   for (let k = j + 1; k < 4; k++)
                {   const dr = ((n[j]&0xFF) - (n[k]&0xFF)) * W_R;
                    const dg = (((n[j]>>8)&0xFF) - ((n[k]>>8)&0xFF)) * W_G;
                    const db = (((n[j]>>16)&0xFF) - ((n[k]>>16)&0xFF)) * W_B;
                    const d = dr*dr + dg*dg + db*db;
                    if (d < minDist) { minDist = d; p = [n[j], k = [n[j], n[k]]]; }
                }
            }
            const r = ((p[0]&0xFF)+(p[1]&0xFF))>>1;
            const g = (((p[0]>>8)&0xFF)+((p[1]>>8)&0xFF))>>1;
            const b = (((p[0]>>16)&0xFF)+((p[1]>>16)&0xFF))>>1;
            buffer[idx] = 0xFF000000 | (b << 16) | (g << 8) | r;
        }
    }
}

function animate()
{   if (!isPaused)
    {   for (let i = 0; i < speeds.speckle; i++) { addSpeckle(); }
        processPixels(speeds.blur, 'blur');
        processPixels(speeds.cluster, 'cluster');
        processPixels(speeds.pattern, 'pattern');
        ctx.putImageData(imgData, 0, 0); }
    requestAnimationFrame(animate); }

function handleInteraction()
{   userInterrupted = true; }

resize();
animate();

(function initSequence()
{   inputList.forEach
    ((el) =>
    {   el.value = 0; });

    allowYellow = false;
    updateButtonUI();

    const colorKeys = ['r', 'g', 'b'];
    const chosenColor = colorKeys[(Math.random() * 3) | 0];
    inputs[chosenColor].value = 255;

    inputs.speckle.value = 100;
    inputs.maxBright.value = 255;
    inputs.opacity.value = 70;
    updateSettings();

    setTimeout
    (() =>
    {   if (userInterrupted) return;
        if (Math.random() < 0.9)
        {   if (chosenColor === 'r' || chosenColor === 'g') inputs.b.value = 255;
            else inputs.r.value = 255;
            updateSettings(); }

        setTimeout
        (() =>
        {   if (userInterrupted) return;
            if (Math.random() < 0.5)
            {   allowYellow = true;
                updateButtonUI();
                updateSettings(); }

            setTimeout
            (() =>
            {   if (userInterrupted) return;
                inputs.speckle.value = 0;
                inputs.blur.value = 100;
                inputs.cluster.value = 100;
                inputs.pattern.value = 100;
                updateSettings();

                setTimeout
                (() =>
                {   if (userInterrupted) return;
                    inputs.blur.value = 0;
                    updateSettings(); }, (Math.random() * 5000));

                setTimeout
                (() =>
                {   if (userInterrupted) return;
                    inputs.pattern.value = 50;
                    updateSettings(); }, (Math.random() * 5000));
            }, 3000);
        }, 3000);
    }, 3000);
})
();

controlContainer.addEventListener
('input', (e) =>
{   if (e.target.id !== 'opacityRate') handleInteraction();
    if (isPaused && e.target.type === 'range')
    {   isPaused = false;
        pauseBtn.textContent = "Pause"; }
    updateSettings();
});

document.getElementById('changeBackgroundBtn').addEventListener
('click', () =>
{   controlContainer.style.display = 'flex';
    document.getElementById('changeBackgroundBtn').style.display = 'none';
});

document.getElementById('hideControlsBtn').addEventListener
('click', () =>
{   controlContainer.style.display = 'none';
    document.getElementById('changeBackgroundBtn').style.display = 'block';
});

pauseBtn.addEventListener
('click', (e) =>
{   handleInteraction();
    isPaused = !isPaused;
    e.target.textContent = isPaused ? "Unpause" : "Pause";
});

btnYellow.addEventListener
('click', () =>
{   handleInteraction();
    allowYellow = !allowYellow;
    updateButtonUI(); });
}

)
();

</script>

<script>

(function()

{
const canvas = document.getElementById('noiseCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

const inputs =
{   k: document.getElementById('kRate'),
    b: document.getElementById('bRate'),
    g: document.getElementById('gRate'),
    r: document.getElementById('rRate'),
    m: document.getElementById('mRate'),
    c: document.getElementById('cRate'),
    blur: document.getElementById('blurRate'),
    cluster: document.getElementById('clusterRate'),
    brightness: document.getElementById('brightnessRate') };

let width, height, totalPixels, imgData, buffer;
let kSpeed = 0, bSpeed = 0, gSpeed = 0, rSpeed = 0, mSpeed = 0, cSpeed = 0, blurSpeed = 0, clusterSpeed = 0;
let brightnessMin = 1;

const COLOR_K = 0xFF000000;
const COLOR_B = 0xFFFF0000;
const COLOR_G = 0xFF00FF00;
const COLOR_R = 0xFF0000FF;
const COLOR_M = 0xFFFF00FF;
const COLOR_C = 0xFFFFFF00;

Object.values(inputs).forEach
(input =>
{   input.addEventListener('input', updateSettings); }
);

window.addEventListener('resize', resize);

document.getElementById('zeroBtn').addEventListener
('click', () =>
{   Object.values(inputs).forEach
    (input =>
    {   input.value = 0; });
    updateSettings(); }
);

function updateSettings()
{   const maxPixels = (totalPixels / 5) | 0;

    const calculateSpeed = (val) =>
    {   const normalized = parseFloat(val) / 100;
        return (Math.pow(normalized, 3) * maxPixels) | 0; };

    kSpeed = calculateSpeed(inputs.k.value);
    bSpeed = calculateSpeed(inputs.b.value);
    gSpeed = calculateSpeed(inputs.g.value);
    rSpeed = calculateSpeed(inputs.r.value);
    mSpeed = calculateSpeed(inputs.m.value);
    cSpeed = calculateSpeed(inputs.c.value);
    blurSpeed = calculateSpeed(inputs.blur.value);
    clusterSpeed = calculateSpeed(inputs.cluster.value);
    brightnessMin = parseFloat(inputs.brightness.value) / 100;

    const updateTrack = (el, activeColor, dimColor) =>
    {   const pct = (el.value - el.min) / (el.max - el.min) * 100;
        el.style.background = `linear-gradient(to right, ${activeColor} ${pct}%, ${dimColor} ${pct}%)`; };

    updateTrack(inputs.k, '#444444', 'rgba(68, 68, 68, 0.2)');
    updateTrack(inputs.b, '#4444ff', 'rgba(68, 68, 255, 0.2)');
    updateTrack(inputs.g, '#44ff44', 'rgba(68, 255, 68, 0.2)');
    updateTrack(inputs.r, '#ff4444', 'rgba(255, 68, 68, 0.2)');
    updateTrack(inputs.m, '#ff44ff', 'rgba(255, 68, 255, 0.2)');
    updateTrack(inputs.c, '#44ffff', 'rgba(68, 255, 255, 0.2)');
    updateTrack(inputs.blur, '#aaaaaa', 'rgba(170, 170, 170, 0.2)');
    updateTrack(inputs.cluster, '#ffaa00', 'rgba(255, 170, 0, 0.2)');
    updateTrack(inputs.brightness, '#ffffff', 'rgba(255, 255, 255, 0.2)');
}

function resize()
{   width = window.innerWidth;
    height = window.innerHeight;
    totalPixels = width * height;
    canvas.width = width;
    canvas.height = height;
    imgData = ctx.createImageData(width, height);
    buffer = new Uint32Array(imgData.data.buffer);
    buffer.fill(0xFF000000);
    updateSettings(); }

function applyPixels(count, pureColor)
{   const scaleColor = pureColor !== COLOR_K && brightnessMin < 1;

    for (let i = 0; i < count; i++)
    {   const x = (Math.random() * width) | 0;
        const y = (Math.random() * height) | 0;

        if (!scaleColor)
        {   buffer[y * width + x] = pureColor;
            continue; }

        const factor = brightnessMin + Math.random() * (1 - brightnessMin);

        const r = ((pureColor & 0xFF) * factor) | 0;
        const g = (((pureColor >> 8) & 0xFF) * factor) | 0;
        const b = (((pureColor >> 16) & 0xFF) * factor) | 0;

        buffer[y * width + x] = 0xFF000000 | (b << 16) | (g << 8) | r; }
}

function applyBlur(count)
{   for (let i = 0; i < count; i++)
    {   const x = (Math.random() * width) | 0;
        const y = (Math.random() * height) | 0;
        const idx = y * width + x;

        const xLeft = x > 0 ? x - 1 : x;
        const xRight = x < width - 1 ? x + 1 : x;
        const yUp = y > 0 ? y - 1 : y;
        const yDown = y < height - 1 ? y + 1 : y;

        const n1 = buffer[yUp * width + x];
        const n2 = buffer[yDown * width + x];
        const n3 = buffer[y * width + xLeft];
        const n4 = buffer[y * width + xRight];

        const avgR = ((n1 & 0xFF) + (n2 & 0xFF) + (n3 & 0xFF) + (n4 & 0xFF)) >> 2;
        const avgG = (((n1 >> 8) & 0xFF) + ((n2 >> 8) & 0xFF) + ((n3 >> 8) & 0xFF) + ((n4 >> 8) & 0xFF)) >> 2;
        const avgB = (((n1 >> 16) & 0xFF) + ((n2 >> 16) & 0xFF) + ((n3 >> 16) & 0xFF) + ((n4 >> 16) & 0xFF)) >> 2;

        buffer[idx] = 0xFF000000 | (avgB << 16) | (avgG << 8) | avgR; }
}

function applyCluster(count)
{   for (let i = 0; i < count; i++)
    {   const x = (Math.random() * width) | 0;
        const y = (Math.random() * height) | 0;
        const idx = y * width + x;

        const xLeft = x > 0 ? x - 1 : x;
        const xRight = x < width - 1 ? x + 1 : x;
        const yUp = y > 0 ? y - 1 : y;
        const yDown = y < height - 1 ? y + 1 : y;

        const neighbors =
        [   buffer[yUp * width + x],
            buffer[yDown * width + x],
            buffer[y * width + xLeft],
            buffer[y * width + xRight] ];

        const pick = (Math.random() * 4) | 0;
        buffer[idx] = neighbors[pick]; }
}

function animate()
{   applyPixels(kSpeed, COLOR_K);
    applyPixels(bSpeed, COLOR_B);
    applyPixels(gSpeed, COLOR_G);
    applyPixels(rSpeed, COLOR_R);
    applyPixels(mSpeed, COLOR_M);
    applyPixels(cSpeed, COLOR_C);
    applyBlur(blurSpeed);
    applyCluster(clusterSpeed);

    ctx.putImageData(imgData, 0, 0);
    requestAnimationFrame(animate);
}

resize();
animate();
}

)
();

</script>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <title>alecgargett.net - Alec Gargett</title>
    <style>
        :root { --ui-color: rgb(0, 255, 255); }

        html {
            background-color: #000;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: transparent;
            color: var(--ui-color);
            font-family: Silkscreen, 'Courier New', Courier, monospace, sans-serif;
            text-align: center;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            image-rendering: pixelated;
        }

        #ui-layer { width: 100%; pointer-events: none; z-index: 10; }

        #controls {
            pointer-events: auto;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: none; /* Hidden by default */
            flex-direction: column;
            gap: 12px;
            align-items: center;
            width: 90%;
            max-width: 350px;
            margin: 20px auto;
        }

        .control-group { width: 100%; display: flex; flex-direction: column; }
        .control-group label {
            font-size: 10px;
            text-transform: uppercase;
            color: white;
            margin-bottom: 2px;
            text-align: left;
            pointer-events: none;
        }

        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            outline: none;
            margin: 15px 0;
            touch-action: pan-y;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 8px rgba(0,0,0,0.5);
        }

        .red-slider::-webkit-slider-thumb { background: #ff4444; }
        .green-slider::-webkit-slider-thumb { background: #44ff44; }
        .blue-slider::-webkit-slider-thumb { background: #4444ff; }
        .speed-slider::-webkit-slider-thumb { background: #ffffff; }
        .mix-slider::-webkit-slider-thumb { background: #cc88ff; }
        .blur-slider::-webkit-slider-thumb { background: #aaaaaa; }
        .cluster-slider::-webkit-slider-thumb { background: #ffaa00; }
        .pattern-slider::-webkit-slider-thumb { background: #00ffff; }

        #controls, .ui-button, .glass {
            background-color: rgba(0, 0, 0, 0.7) !important; }

        .ui-button {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            color: var(--ui-color);
            font-family: Silkscreen;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
            pointer-events: auto;
        }
        .ui-button:active { background-color: rgba(0, 0, 0, 0.8); }

        #showControlsBtn {
            max-width: 200px;
            margin: 20px auto;
            display: block;
        }

        footer {
            padding: 40px 0;
            color: var(--ui-color);
            font-size: 12px;
        }
    </style>
</head>

<body>

<div id="ui-layer">
    <section class="hero-spacer" style="min-height: 100vh" aria-hidden="true"></section>

    <button id="showControlsBtn" class="ui-button">Show Controls</button>

    <div id="controls">
        <div class="control-group">
            <label for="rRate">Red</label>
            <input type="range" id="rRate" class="red-slider" min="0" max="100" value="0">
        </div>
        <div class="control-group">
            <label for="gRate">Green</label>
            <input type="range" id="gRate" class="green-slider" min="0" max="100" value="0">
        </div>
        <div class="control-group">
            <label for="bRate">Blue</label>
            <input type="range" id="bRate" class="blue-slider" min="0" max="100" value="0">
        </div>
        <div class="control-group">
            <label for="speedRate">Speed</label>
            <input type="range" id="speedRate" class="speed-slider" min="0" max="100" value="90">
        </div>
        <div class="control-group">
            <label for="mixRate">Mix</label>
            <input type="range" id="mixRate" class="mix-slider" min="0" max="100" value="50">
        </div>
        <div class="control-group">
            <label for="blurRate">Blur</label>
            <input type="range" id="blurRate" class="blur-slider" min="0" max="100" value="90">
        </div>
        <div class="control-group">
            <label for="clusterRate">Cluster</label>
            <input type="range" id="clusterRate" class="cluster-slider" min="0" max="100" value="100">
        </div>
        <div class="control-group">
            <label for="patternRate">Pattern</label>
            <input type="range" id="patternRate" class="pattern-slider" min="0" max="100" value="50">
        </div>

        <button id="pauseBtn" class="ui-button">Pause</button>
        <button id="hideControlsBtn" class="ui-button">Hide Controls</button>
    </div>

    <section class="hero-spacer" style="min-height: 100vh" aria-hidden="true"></section>
</div>

<footer>
  <p><span class="glass">&copy; 2026 Alec Gargett. All rights reserved.</span></p>
</footer>

<canvas id="noiseCanvas"></canvas>

<script>
(function() {
    const canvas = document.getElementById('noiseCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });

    const controls = document.getElementById('controls');
    const showBtn = document.getElementById('showControlsBtn');
    const hideBtn = document.getElementById('hideControlsBtn');
    const pauseBtn = document.getElementById('pauseBtn');

    const inputs = {
        r: document.getElementById('rRate'),
        g: document.getElementById('gRate'),
        b: document.getElementById('bRate'),
        speed: document.getElementById('speedRate'),
        mix: document.getElementById('mixRate'),
        blur: document.getElementById('blurRate'),
        cluster: document.getElementById('clusterRate'),
        pattern: document.getElementById('patternRate')
    };

    let width, height, totalPixels, imgData, buffer;
    let blurSpeed = 0, clusterSpeed = 0, placeSpeed = 0, patternSpeed = 0;
    let rProps = { weight: 0, min: 0, max: 0 };
    let gProps = { weight: 0, min: 0, max: 0 };
    let bProps = { weight: 0, min: 0, max: 0 };
    let mixRatio = 0;
    let isPaused = false;
    let pausedState = null;

    Object.values(inputs).forEach(input => input.addEventListener('input', updateSettings));

    // Visibility Toggles
    showBtn.addEventListener('click', () => {
            controls.style.display = 'flex';
            showBtn.style.display = 'none';

            // Use requestAnimationFrame to ensure the browser has
            // calculated the height after display: flex was applied
            requestAnimationFrame(() => {
                const viewportHeight = window.innerHeight;
                const controlsHeight = controls.offsetHeight;

                if (controlsHeight < viewportHeight) {
                    // If it fits on screen, put it in the middle
                    controls.scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    // If it's taller than the screen, pin to the top so it's not cut off
                    controls.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });



    hideBtn.addEventListener('click', () => {
        controls.style.display = 'none';
        showBtn.style.display = 'block';
    });

    // Pause / Unpause Logic
    pauseBtn.addEventListener('click', () => {
        if (!isPaused) {
            // Logic for Pausing (Zeroing)
            pausedState = {
                blur: inputs.blur.value,
                cluster: inputs.cluster.value,
                speed: inputs.speed.value,
                pattern: inputs.pattern.value
            };
            inputs.blur.value = 0;
            inputs.cluster.value = 0;
            inputs.speed.value = 0;
            inputs.pattern.value = 0;
            pauseBtn.textContent = "Unpause";
            isPaused = true;
        } else {
            // Logic for Unpausing (Restoring)
            if (pausedState) {
                inputs.blur.value = pausedState.blur;
                inputs.cluster.value = pausedState.cluster;
                inputs.speed.value = pausedState.speed;
                inputs.pattern.value = pausedState.pattern;
            }
            pauseBtn.textContent = "Pause";
            isPaused = false;
        }
        updateSettings();
    });

    let lastWidth = window.innerWidth;
    window.addEventListener('resize', () => {
        if (window.innerWidth !== lastWidth) {
            resize();
            lastWidth = window.innerWidth;
        }
    });

    function calculateChannelProps(val) {
        const v = parseFloat(val);
        if (v <= 50) return { weight: v / 50, max: v / 50, min: 0 };
        return { weight: 1.0, max: 1.0, min: (v - 50) / 50 };
    }

    function updateSettings() {
        const referencePixels = Math.max(width * height, window.innerWidth * window.innerHeight);
        const maxPixels = (referencePixels / 5) | 0;
        const calculateSpeed = (val) => (Math.pow(parseFloat(val) / 100, 10) * maxPixels) | 0;

        rProps = calculateChannelProps(inputs.r.value);
        gProps = calculateChannelProps(inputs.g.value);
        bProps = calculateChannelProps(inputs.b.value);

        mixRatio = parseFloat(inputs.mix.value) / 100;
        blurSpeed = calculateSpeed(inputs.blur.value);
        clusterSpeed = calculateSpeed(inputs.cluster.value);
        placeSpeed = calculateSpeed(inputs.speed.value);
        patternSpeed = calculateSpeed(inputs.pattern.value);

        const updateTrack = (el, activeColor, dimColor) => {
            const pct = (el.value - el.min) / (el.max - el.min) * 100;
            el.style.background = `linear-gradient(to right, ${activeColor} ${pct}%, ${dimColor} ${pct}%)`;
        };

        updateTrack(inputs.r, '#ff4444', 'rgba(255, 68, 68, 0.2)');
        updateTrack(inputs.g, '#44ff44', 'rgba(68, 255, 68, 0.2)');
        updateTrack(inputs.b, '#4444ff', 'rgba(68, 68, 255, 0.2)');
        updateTrack(inputs.speed, '#ffffff', 'rgba(255, 255, 255, 0.2)');
        updateTrack(inputs.mix, '#cc88ff', 'rgba(204, 136, 255, 0.2)');
        updateTrack(inputs.blur, '#aaaaaa', 'rgba(170, 170, 170, 0.2)');
        updateTrack(inputs.cluster, '#ffaa00', 'rgba(255, 170, 0, 0.2)');
        updateTrack(inputs.pattern, '#00ffff', 'rgba(0, 255, 255, 0.2)');
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight + 150;
        totalPixels = width * height;
        canvas.width = width;
        canvas.height = height;
        imgData = ctx.createImageData(width, height);
        buffer = new Uint32Array(imgData.data.buffer);
        buffer.fill(0xFF000000);
        updateSettings();
    }

    function applyColorMix(count) {
        for (let i = 0; i < count; i++) {
            const x = (Math.random() * width) | 0;
            const y = (Math.random() * height) | 0;
            const idx = y * width + x;
            const getRandB = (p) => (p.min + Math.random() * (p.max - p.min));

            if (Math.random() >= mixRatio) {
                const totalWeight = rProps.weight + gProps.weight + bProps.weight;
                if (totalWeight <= 0) { buffer[idx] = 0xFF000000; continue; }
                const pick = Math.random() * totalWeight;
                let r=0, g=0, b=0;
                if (pick < rProps.weight) r = (getRandB(rProps) * 255) | 0;
                else if (pick < rProps.weight + gProps.weight) g = (getRandB(gProps) * 255) | 0;
                else b = (getRandB(bProps) * 255) | 0;
                buffer[idx] = 0xFF000000 | (b << 16) | (g << 8) | r;
            } else {
                const r = (getRandB(rProps) * 255) | 0, g = (getRandB(gProps) * 255) | 0, b = (getRandB(bProps) * 255) | 0;
                buffer[idx] = 0xFF000000 | (b << 16) | (g << 8) | r;
            }
        }
    }

    function applyPattern(count) {
        for (let i = 0; i < count; i++) {
            const x = (Math.random() * width) | 0;
            const y = (Math.random() * height) | 0;
            const idx = y * width + x;
            const n = [
                buffer[((y > 0 ? y - 1 : y) * width) + x],
                buffer[((y < height - 1 ? y + 1 : y) * width) + x],
                buffer[(y * width) + (x > 0 ? x - 1 : x)],
                buffer[(y * width) + (x < width - 1 ? x + 1 : x)]
            ];
            const dist = (c1, c2) => {
                const dr = (c1 & 0xFF) - (c2 & 0xFF), dg = ((c1 >> 8) & 0xFF) - ((c2 >> 8) & 0xFF), db = ((c1 >> 16) & 0xFF) - ((c2 >> 16) & 0xFF);
                return dr*dr + dg*dg + db*db;
            };
            let minDist = Infinity; let pair = [n[0], n[1]];
            for(let j=0; j<3; j++) {
                for(let k=j+1; k<4; k++) {
                    let d = dist(n[j], n[k]);
                    if(d < minDist) { minDist = d; pair = [n[j], n[k]]; }
                }
            }
            const c1 = pair[0], c2 = pair[1];
            const avgR = ((c1 & 0xFF) + (c2 & 0xFF)) >> 1, avgG = (((c1 >> 8) & 0xFF) + ((c2 >> 8) & 0xFF)) >> 1, avgB = (((c1 >> 16) & 0xFF) + ((c2 >> 16) & 0xFF)) >> 1;
            buffer[idx] = 0xFF000000 | (avgB << 16) | (avgG << 8) | avgR;
        }
    }

    function applyBlur(count) {
        for (let i = 0; i < count; i++) {
            const x = (Math.random() * width) | 0;
            const y = (Math.random() * height) | 0;
            const n1 = buffer[((y > 0 ? y - 1 : y) * width) + x], n2 = buffer[((y < height - 1 ? y + 1 : y) * width) + x], n3 = buffer[(y * width) + (x > 0 ? x - 1 : x)], n4 = buffer[(y * width) + (x < width - 1 ? x + 1 : x)];
            const avgR = ((n1 & 0xFF) + (n2 & 0xFF) + (n3 & 0xFF) + (n4 & 0xFF)) >> 2, avgG = (((n1 >> 8) & 0xFF) + ((n2 >> 8) & 0xFF) + ((n3 >> 8) & 0xFF) + ((n4 >> 8) & 0xFF)) >> 2, avgB = (((n1 >> 16) & 0xFF) + ((n2 >> 16) & 0xFF) + ((n3 >> 16) & 0xFF) + ((n4 >> 16) & 0xFF)) >> 2;
            buffer[y * width + x] = 0xFF000000 | (avgB << 16) | (avgG << 8) | avgR;
        }
    }

    function applyCluster(count) {
        for (let i = 0; i < count; i++) {
            const x = (Math.random() * width) | 0;
            const y = (Math.random() * height) | 0;
            const n = [buffer[((y > 0 ? y - 1 : y) * width) + x], buffer[((y < height - 1 ? y + 1 : y) * width) + x], buffer[(y * width) + (x > 0 ? x - 1 : x)], buffer[(y * width) + (x < width - 1 ? x + 1 : x)]];
            buffer[y * width + x] = n[(Math.random() * 4) | 0];
        }
    }

    function animate() {
        applyColorMix(placeSpeed);
        applyBlur(blurSpeed);
        applyCluster(clusterSpeed);
        applyPattern(patternSpeed);
        ctx.putImageData(imgData, 0, 0);
        requestAnimationFrame(animate);
    }

    const colorKeys = ['r', 'g', 'b'];
    for (let i = colorKeys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [colorKeys[i], colorKeys[j]] = [colorKeys[j], colorKeys[i]];
    }
    inputs[colorKeys[0]].value = 50;
    inputs[colorKeys[1]].value = 50;

    resize();

    // Initial sequence
    setTimeout(() => { inputs.speed.value = 0; updateSettings(); }, 1000);
    setTimeout(() => { inputs.blur.value = 0; updateSettings(); }, 1500);

    animate();
})();
</script>

</body>
</html>

<script>

(function()

{
const canvas = document.getElementById('noiseCanvas');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });

const inputs =
{   r: document.getElementById('rRate'),
    g: document.getElementById('gRate'),
    b: document.getElementById('bRate'),
    mix: document.getElementById('mixRate'),
    blur: document.getElementById('blurRate'),
    cluster: document.getElementById('clusterRate'),
    speed: document.getElementById('speedRate') };

let width, height, totalPixels, imgData, buffer;
let blurSpeed = 0, clusterSpeed = 0, placeSpeed = 0;
let rBrightness = 1, gBrightness = 0, bBrightness = 1;
let mixRatio = 0;

const COLOR_R = 0xFF0000FF;
const COLOR_G = 0xFF00FF00;
const COLOR_B = 0xFFFF0000;

Object.values(inputs).forEach
(input =>
{   input.addEventListener('input', updateSettings); }
);

window.addEventListener('resize', resize);

document.getElementById('zeroBtn').addEventListener
('click', () =>
{   const stored =
    {   blur: inputs.blur.value,
        cluster: inputs.cluster.value,
        speed: inputs.speed.value };

    localStorage.setItem('zeroStash', JSON.stringify(stored));

    inputs.blur.value = 0;
    inputs.cluster.value = 0;
    inputs.speed.value = 0;
    updateSettings(); }
);

document.getElementById('unzeroBtn').addEventListener
('click', () =>
{   const raw = localStorage.getItem('zeroStash');
    if (!raw) return;

    const stored = JSON.parse(raw);

    inputs.blur.value = stored.blur;
    inputs.cluster.value = stored.cluster;
    inputs.speed.value = stored.speed;
    updateSettings(); }
);

function updateSettings()
{   const maxPixels = (totalPixels / 5) | 0;

    const calculateSpeed = (val) =>
    {   const normalized = parseFloat(val) / 100;
        return (Math.pow(normalized, 10) * maxPixels) | 0; };

    rBrightness = parseFloat(inputs.r.value) / 100;
    gBrightness = parseFloat(inputs.g.value) / 100;
    bBrightness = parseFloat(inputs.b.value) / 100;
    mixRatio = parseFloat(inputs.mix.value) / 100;

    blurSpeed = calculateSpeed(inputs.blur.value);
    clusterSpeed = calculateSpeed(inputs.cluster.value);
    placeSpeed = calculateSpeed(inputs.speed.value);

    const updateTrack = (el, activeColor, dimColor) =>
    {   const pct = (el.value - el.min) / (el.max - el.min) * 100;
        el.style.background = `linear-gradient(to right, ${activeColor} ${pct}%, ${dimColor} ${pct}%)`; };

    updateTrack(inputs.r, '#ff4444', 'rgba(255, 68, 68, 0.2)');
    updateTrack(inputs.g, '#44ff44', 'rgba(68, 255, 68, 0.2)');
    updateTrack(inputs.b, '#4444ff', 'rgba(68, 68, 255, 0.2)');
    updateTrack(inputs.mix, '#cc88ff', 'rgba(204, 136, 255, 0.2)');
    updateTrack(inputs.blur, '#aaaaaa', 'rgba(170, 170, 170, 0.2)');
    updateTrack(inputs.cluster, '#ffaa00', 'rgba(255, 170, 0, 0.2)');
    updateTrack(inputs.speed, '#ffffff', 'rgba(255, 255, 255, 0.2)');
}

function resize()
{   width = window.innerWidth;
    height = window.innerHeight;
    totalPixels = width * height;
    canvas.width = width;
    canvas.height = height;
    imgData = ctx.createImageData(width, height);
    buffer = new Uint32Array(imgData.data.buffer);
    buffer.fill(0xFF000000);
    updateSettings(); }

function applyColorMix(count)
{   for (let i = 0; i < count; i++)
    {   const x = (Math.random() * width) | 0;
        const y = (Math.random() * height) | 0;

        if (Math.random() >= mixRatio)
        {   const total = rBrightness + gBrightness + bBrightness;

            if (total <= 0)
            {   buffer[y * width + x] = 0xFF000000;
                continue; }

            const pick = Math.random() * total;
            let pureColor, brightness;

            if (pick < rBrightness)
            {   pureColor = COLOR_R; brightness = rBrightness; }
            else if (pick < rBrightness + gBrightness)
            {   pureColor = COLOR_G; brightness = gBrightness; }
            else
            {   pureColor = COLOR_B; brightness = bBrightness; }

            const spread = (b) => 2 * 255 * Math.min(b, 1 - b);
            const factor = Math.max(0, Math.min(255, (255 * brightness + (Math.random() - 0.5) * spread(brightness)) | 0)) / 255;

            const r = ((pureColor & 0xFF) * factor) | 0;
            const g = (((pureColor >> 8) & 0xFF) * factor) | 0;
            const b = (((pureColor >> 16) & 0xFF) * factor) | 0;

            buffer[y * width + x] = 0xFF000000 | (b << 16) | (g << 8) | r;
            continue; }

        const spread = (b) => 2 * 255 * Math.min(b, 1 - b);

        const r = Math.max(0, Math.min(255, (255 * rBrightness + (Math.random() - 0.5) * spread(rBrightness)) | 0));
        const g = Math.max(0, Math.min(255, (255 * gBrightness + (Math.random() - 0.5) * spread(gBrightness)) | 0));
        const b = Math.max(0, Math.min(255, (255 * bBrightness + (Math.random() - 0.5) * spread(bBrightness)) | 0));

        buffer[y * width + x] = 0xFF000000 | (b << 16) | (g << 8) | r; }
}

function applyBlur(count)
{   for (let i = 0; i < count; i++)
    {   const x = (Math.random() * width) | 0;
        const y = (Math.random() * height) | 0;
        const idx = y * width + x;

        const xLeft = x > 0 ? x - 1 : x;
        const xRight = x < width - 1 ? x + 1 : x;
        const yUp = y > 0 ? y - 1 : y;
        const yDown = y < height - 1 ? y + 1 : y;

        const n1 = buffer[yUp * width + x];
        const n2 = buffer[yDown * width + x];
        const n3 = buffer[y * width + xLeft];
        const n4 = buffer[y * width + xRight];

        const avgR = ((n1 & 0xFF) + (n2 & 0xFF) + (n3 & 0xFF) + (n4 & 0xFF)) >> 2;
        const avgG = (((n1 >> 8) & 0xFF) + ((n2 >> 8) & 0xFF) + ((n3 >> 8) & 0xFF) + ((n4 >> 8) & 0xFF)) >> 2;
        const avgB = (((n1 >> 16) & 0xFF) + ((n2 >> 16) & 0xFF) + ((n3 >> 16) & 0xFF) + ((n4 >> 16) & 0xFF)) >> 2;

        buffer[idx] = 0xFF000000 | (avgB << 16) | (avgG << 8) | avgR; }
}

function applyCluster(count)
{   for (let i = 0; i < count; i++)
    {   const x = (Math.random() * width) | 0;
        const y = (Math.random() * height) | 0;
        const idx = y * width + x;

        const xLeft = x > 0 ? x - 1 : x;
        const xRight = x < width - 1 ? x + 1 : x;
        const yUp = y > 0 ? y - 1 : y;
        const yDown = y < height - 1 ? y + 1 : y;

        const neighbors =
        [   buffer[yUp * width + x],
            buffer[yDown * width + x],
            buffer[y * width + xLeft],
            buffer[y * width + xRight] ];

        const pick = (Math.random() * 4) | 0;
        buffer[idx] = neighbors[pick]; }
}

function animate()
{   applyColorMix(placeSpeed);
    applyBlur(blurSpeed);
    applyCluster(clusterSpeed);

    ctx.putImageData(imgData, 0, 0);
    requestAnimationFrame(animate);
}

resize();
animate();
}

)
();

</script>
